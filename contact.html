  <title>Contact | Mark Roe</title>

  <style>
    header {
      position: fixed;
      top: 0;
      left: 0;
      padding: 1rem;
      z-index: 1000;
    }

    .site-logo {
      height: 80px;
      width: auto;
      display: block;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Georgia', serif;
      background: #fdfdfb;
      color: #222;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    nav {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      height: 80px;
      padding: 0 40px;
      font-size: 1.55rem;
      color: #666;
    }

    nav a {
      margin-left: 20px;
      text-decoration: none;
      color: #666;
    }

    nav a:hover {
      color: #000;
    }

    .contact-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      text-align: center;
      padding: 40px;
      padding-top: 0px;
    }

    h1 {
      font-variant: small-caps;
      width: 1000px;
      font-size: 2.8rem;
      margin-top: 40px;
      padding-top: 10px;
      border-bottom: 2px solid #666;
      padding-bottom: 10px;
      margin-bottom: 30px;
    }

    /* -------------------------
       Desktop two-column layout
       ------------------------- */
    .contact-block {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 40px;
      font-size: 1.2rem;
      margin-top: 10px;
    }

    .contact-labels,
    .contact-values {
      display: flex;
      flex-direction: column;
      gap: 20px;
      text-align: left;
    }

    .contact-labels {
      font-weight: bold;
      color: #444;
      min-width: 160px;
      text-align: left;
    }

    .contact-labels p {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      margin: 0;
    }

    .contact-labels img {
      width: 24px;
      height: 24px;
      vertical-align: middle;
    }

    .contact-values p {
      margin: 0;
    }

    .contact-values a {
      color: #222;
      text-decoration: none;
    }

    .contact-values a:hover {
      text-decoration: underline;
    }

    .divider {
      width: 1px;
      background-color: #999;
      height: 100%;
    }

    /* -------------------------
       Mobile paired layout
       ------------------------- */
    .contact-list {
      display: none; /* shown only on mobile */
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      text-align: left;
    }

    .contact-item {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      background: #fff;
      margin-bottom: 14px;
    }

    .contact-item .label {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: bold;
      color: #444;
      margin-bottom: 10px;
      font-size: 1.05rem;
    }

    .contact-item .label img {
      width: 24px;
      height: 24px;
    }

    .contact-item a {
      display: inline-block;
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fdfdfb;
      text-decoration: none;
      color: #222;
      font-size: 1.05rem;
    }

    .contact-item a:hover {
      border-color: #666;
      color: #000;
    }

    @media (max-width: 768px) {
      header {
        position: static;
        width: 100%;
        text-align: center;
        padding: 1rem 0 0.5rem 0;
      }

      .site-logo {
        height: 60px;
        margin: 0 auto;
      }

      nav {
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px 14px;
        padding: 0.75rem 1rem 1rem 1rem;
        font-size: 1.2rem;
        text-align: center;
        height: auto;
      }

      nav a {
        margin-left: 0;
      }

      body {
        height: auto;
      }

      .contact-container {
        padding: 18px 16px 40px 16px;
      }

      h1 {
        width: 100%;
        font-size: 2rem;
        padding: 0 10px 10px 10px;
        box-sizing: border-box;
        margin: 12px auto 18px auto;
      }

      /* Hide the desktop block on mobile */
      .contact-block {
        display: none;
      }

      /* Show the mobile list */
      .contact-list {
        display: block;
      }
    }
  </style>
</head>
