    }

    .card {

    }

    p {
      font-size: 1.2rem;
      line-height: 1.7;
      margin: 16px 0;
      text-align: justify;
      hyphens: auto;
    }

    .actions {
      margin-top: 26px;
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 10px 16px;
      border: 1px solid #666;
      border-radius: 6px;
      text-decoration: none;
      color: #222;
      font-size: 1.05rem;
    }

    .btn:hover {
      background: #f2f2ef;
      border-color: #000;
      color: #000;
    }

    @media (max-width: 768px) {
      header {
        position: static;
        width: 100%;
        text-align: center;
        padding: 1rem 0;
