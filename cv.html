<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-14HMNXG7DB"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-14HMNXG7DB');
  </script>

  <!-- Favicons -->
  <link rel="icon" href="assets/icons/favicon.ico" media="(prefers-color-scheme: light)">
  <link rel="icon" href="assets/icons/favicon-white.ico" media="(prefers-color-scheme: dark)">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CV | Mark Roe</title>

  <style>
    header {
      position: fixed;
      top: 0;
      left: 0;
      padding: 1rem;
      z-index: 1000;
    }

    .site-logo {
      height: 80px;
      width: auto;
      display: block;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Georgia', serif;
      background: #fdfdfb;
      color: #222;
    }

    nav {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      height: 80px;
      padding: 0 40px;
      font-size: 1.55rem;
      color: #666;
    }

    nav a {
      margin-left: 20px;
      text-decoration: none;
      color: #666;
    }

    nav a:hover {
      color: #000;
    }

    .container {
      padding: 15px 60px;
      text-align: center;
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 30px;
    }

    h1 {
      font-variant: small-caps;
      width: 1000px;
      margin: 40px auto 30px auto;
      border-bottom: 2px solid #666;
      padding-bottom: 10px;
      font-size: 2.5rem;
    }

    .download-button {
      display: inline-block;
      margin-top: 5px;
      padding: 10px 20px;
      background-color: #222;
      color: #fff;
      text-decoration: none;
      font-size: 1.1rem;
      border-radius: 6px;
    }

    .download-button:hover {
      background-color: #444;
    }

    /* Mobile helper UI (hidden on desktop) */
    .mobile-note,
    .open-button {
      display: none;
    }

    .open-button {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 20px;
      background: #fdfdfb;
      color: #222;
      text-decoration: none;
      font-size: 1.05rem;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .open-button:hover {
      border-color: #666;
      color: #000;
    }

    .pdf-wrapper {
      max-width: 900px;
      margin: 0 auto;
    }

    .pdf-frame {
      width: 100%;
      height: 1200px;
      border: none;
    }

    /* -------------------------
       Mobile
       ------------------------- */
    @media (max-width: 768px) {
      header {
        position: static;
        width: 100%;
        text-align: center;
        padding: 1rem 0 0.5rem 0;
      }

      .site-logo {
        height: 60px;
        margin: 0 auto;
      }

      nav {
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px 14px;
        padding: 0.75rem 1rem 1rem 1rem;
        font-size: 1.2rem;
        text-align: center;
        height: auto;
      }

      nav a {
        margin-left: 0;
      }

      .container {
        padding: 18px 16px 40px 16px;
        text-align: center;
      }

      h1 {
        width: 100%;
        font-size: 2rem;
        padding: 0 10px 10px 10px;
        box-sizing: border-box;
        margin: 12px auto 14px auto;
      }

      .download-button {
        font-size: 1rem;
        padding: 10px 16px;
        margin-top: 10px;
      }

      /* Show the mobile helper UI */
      .mobile-note,
      .open-button {
        display: inline-block;
      }

      .mobile-note {
        display: block;
        max-width: 520px;
        margin: 14px auto 0 auto;
        font-size: 1.0rem;
        line-height: 1.6;
        color: #555;
        padding: 0 6px;
      }

      /* Hide embedded PDF on mobile (cleaner UX) */
      .pdf-wrapper {
        display: none;
      }
    }
  </style>
</head>

<body>
  <header>
    <a href="index.html">
      <img src="assets/logos/logo.png" alt="Logo" class="site-logo">
    </a>
  </header>

  <nav>
    <a href="index.html" title="Return to the homepage">Home</a>
    <a href="about.html" title="Learn more about me">About</a>
    <a href="portfolio.html" title="View my project work">Portfolio</a>
    <a href="cv.html" title="See my academic and work history">CV</a>
    <a href="contact.html" title="Get in touch">Contact</a>
  </nav>

  <div class="container">
    <div class="header">
      <h1>Curriculum Vitae</h1>

      <a href="assets/pdfs/MarkRoe_CV.pdf" download class="download-button">Download CV (PDF)</a>

      <p class="mobile-note">
        On mobile, the PDF viewer can be a bit awkward — best experience is to open the CV directly.
      </p>

      <a href="assets/pdfs/MarkRoe_CV.pdf" class="open-button" target="_blank" rel="noopener">
        Open CV in a new tab
      </a>
    </div>

    <div class="pdf-wrapper">
      <iframe src="assets/pdfs/MarkRoe_CV.pdf" class="pdf-frame" title="Mark Roe CV"></iframe>
    </div>
  </div>
</body>
</html>
